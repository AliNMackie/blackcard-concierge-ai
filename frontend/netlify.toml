# Netlify configuration for Next.js 16 App Router
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_USE_NETLIFY_EDGE = "true"

[[redirects]]
  from = "/api/*"
  to = "https://elite-concierge-api-zx7q.a.run.app/api/:splat" # Replace with actual Cloud Run URL after deployment
  status = 200

# Continuous Inference WebSocket Proxy (Optional, direct connection preferred)
